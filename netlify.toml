# Публикация на Netlify: просто статика, сборка не нужна
[build]
  publish = "."
  command = ""

# Короткая ссылка на лендинг: /welcome → landing/index.html
[[redirects]]
  from = "/welcome"
  to = "/landing/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
