name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build application and demo
        run: node build.mjs
      - name: Static checks
        run: node tests/static.mjs
      - name: Telegram parser tests
        run: node tests/telegram.mjs
      - name: Ensure generated HTML is committed
        run: git diff --exit-code -- index.html FinTrack-AI-demo.html
